name: Daily Metrics Run

on:
  schedule:
    - cron: "30 13 * * 1-5"  # runs 22:00 UTC (5pm ET)
  workflow_dispatch:        # allows manual trigger

jobs:
  run-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Call Raspberry Pi API
        id: call_api
        run: |
          RESULT=$(curl -s -X GET \
            -H "api-key: ${{ secrets.API_KEY }}" \
            "${{ secrets.PUBLIC_RUN_METRIC_URL }}")

          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$RESULT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send pretty JSON to Discord (FAST + RELIABLE)
        run: |
          # Pretty-format JSON using jq and write to file
          echo '${{ steps.call_api.outputs.result }}' | jq '.' > metrics.json

          # Upload as a file in a single Discord request
          curl -s -X POST \
            -H "Content-Type: multipart/form-data" \
            -F "file=@metrics.json" \
            -F "payload_json={\"content\": \"📊 Daily Metrics Report (attached)\"}" \
            ${{ secrets.DISCORD_WEBHOOK }}


