name: Daily Metrics Run

on:
  schedule:
    - cron: "30 13 * * 1-5"  # runs 22:00 UTC (5pm ET)
  workflow_dispatch:        # allows manual trigger

jobs:
  run-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Call Raspberry Pi API
        id: call_api
        run: |
          RESULT=$(curl -s -X GET \
            -H "api-key: ${{ secrets.API_KEY }}" \
            "${{ secrets.PUBLIC_RUN_METRIC_URL }}")

          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$RESULT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send pretty JSON to Discord in multiple messages
        run: |
          # Convert JSON to pretty format using jq
          PRETTY_JSON=$(echo '${{ steps.call_api.outputs.result }}' | jq '.')

          # Function to send messages safely
          send_chunk() {
            CHUNK="$1"
            # Escape backticks to keep code blocks clean
            CHUNK_ESCAPED=$(printf '%s' "$CHUNK" | sed 's/\`/\\\`/g')
            curl -X POST \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"\`\`\`json\n$CHUNK_ESCAPED\n\`\`\`\"}" \
              ${{ secrets.DISCORD_WEBHOOK }}
          }

          # Split the pretty JSON into 1900-character chunks (safe margin)
          echo "$PRETTY_JSON" | fold -w 1900 > chunks.txt

          # Send each chunk as a separate Discord message
          while IFS= read -r chunk; do
            send_chunk "$chunk"
            sleep 1  # avoid Discord rate limits
          done < chunks.txt

