name: Daily Metrics Run

on:
  schedule:
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

jobs:
  run-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq bc

      - name: Fetch metrics from Raspberry Pi
        id: fetch
        run: |
          RESPONSE=$(curl -s -X GET \
            -H "api-key: ${{ secrets.API_KEY }}" \
            "${{ secrets.PUBLIC_RUN_METRIC_URL }}")

          echo "response<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESPONSE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Debug raw API output
        run: |
          echo "---- RAW DATA ----"
          echo "${{ steps.fetch.outputs.data }}"

      - name: Send pretty Discord embeds
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          DATA="${{ steps.fetch.outputs.response }}"

          echo "$DATA" | jq -c '.data | to_entries[]' | while read -r entry; do

            TICKER=$(echo "$entry" | jq -r '.key')
            EV=$(echo "$entry" | jq -r '.value.evaluation')
            LATEST=$(echo "$entry" | jq -r '.value.latest')

            BUY=$(echo "$EV" | jq -r '.BUY // 0')
            HOLD=$(echo "$EV" | jq -r '.HOLD // 0')
            SELL=$(echo "$EV" | jq -r '.SELL // 0')

            BUY_PCT=$(printf "%.0f" "$(echo "$BUY * 100" | bc)")
            HOLD_PCT=$(printf "%.0f" "$(echo "$HOLD * 100" | bc)")
            SELL_PCT=$(printf "%.0f" "$(echo "$SELL * 100" | bc)")

            OPEN=$(echo "$LATEST" | jq -r '.Open // "N/A"')
            HIGH=$(echo "$LATEST" | jq -r '.High // "N/A"')
            LOW=$(echo "$LATEST" | jq -r '.Low // "N/A"')
            CLOSE=$(echo "$LATEST" | jq -r '.Close // "N/A"')
            VOLUME=$(echo "$LATEST" | jq -r '.Volume // "N/A"')
            UNVOL=$(echo "$LATEST" | jq -r '.unusual_volume // "N/A"')

            PCT=$(echo "$LATEST" | jq -r '.pct_change // "N/A"')
            MA50=$(echo "$LATEST" | jq -r '.ma50 // "N/A"')
            MA200=$(echo "$LATEST" | jq -r '.ma200 // "N/A"')
            RSI=$(echo "$LATEST" | jq -r '.rsi // "N/A"')
            MACD=$(echo "$LATEST" | jq -r '.macd // "N/A"')
            MACD_SIGNAL=$(echo "$LATEST" | jq -r '.macd_signal // "N/A"')
            ATR=$(echo "$LATEST" | jq -r '.atr // "N/A"')
            REL=$(echo "$LATEST" | jq -r '.rel_strength // "N/A"')

            HIGH52=$(echo "$LATEST" | jq -r '."52w_high" // "N/A"')
            LOW52=$(echo "$LATEST" | jq -r '."52w_low" // "N/A"')

            # Build embed JSON using jq (avoids YAML escaping issues)
            PAYLOAD=$(jq -n \
              --arg t "$TICKER" \
              --arg buy "$BUY_PCT%" \
              --arg hold "$HOLD_PCT%" \
              --arg sell "$SELL_PCT%" \
              --arg open "$OPEN" \
              --arg high "$HIGH" \
              --arg low "$LOW" \
              --arg close "$CLOSE" \
              --arg pct "$PCT" \
              --arg vol "$VOLUME" \
              --arg unvol "$UNVOL" \
              --arg ma50 "$MA50" \
              --arg ma200 "$MA200" \
              --arg rsi "$RSI" \
              --arg macd "$MACD" \
              --arg macdsig "$MACD_SIGNAL" \
              --arg atr "$ATR" \
              --arg rel "$REL" \
              --arg h52 "$HIGH52" \
              --arg l52 "$LOW52" \
              '{
                embeds: [
                  {
                    title: ("📈 " + $t + " Metrics"),
                    color: 5814783,
                    fields: [
                      { name: "Buy", value: $buy, inline: true },
                      { name: "Hold", value: $hold, inline: true },
                      { name: "Sell", value: $sell, inline: true },

                      { name: "Open", value: $open, inline: true },
                      { name: "High", value: $high, inline: true },
                      { name: "Low", value: $low, inline: true },
                      { name: "Close", value: $close, inline: true },
                      { name: "Pct Change", value: $pct, inline: true },
                      { name: "Volume", value: $vol, inline: true },
                      { name: "Unusual Vol", value: $unvol, inline: true },

                      { name: "MA50", value: $ma50, inline: true },
                      { name: "MA200", value: $ma200, inline: true },
                      { name: "RSI", value: $rsi, inline: true },
                      { name: "MACD", value: $macd, inline: true },
                      { name: "MACD Signal", value: $macdsig, inline: true },
                      { name: "ATR", value: $atr, inline: true },
                      { name: "Relative Strength", value: $rel, inline: true },

                      { name: "52w High", value: $h52, inline: true },
                      { name: "52w Low", value: $l52, inline: true }
                    ]
                  }
                ]
              }'
            )

            curl -s -X POST \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$WEBHOOK"

            sleep 1
          done
