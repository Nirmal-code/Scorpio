name: Daily Metrics + News Run

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq bc

      # -----------------------------------------------------------
      # FETCH METRICS (save to file)
      # -----------------------------------------------------------
      - name: Fetch metrics
        id: metrics
        run: |
          curl -s \
            -H "api-key: ${{ secrets.API_KEY }}" \
            "${{ secrets.PUBLIC_RUN_METRIC_URL }}" \
            > metrics.json

          echo "metrics_file=metrics.json" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------
      # FETCH NEWS (save to file)
      # -----------------------------------------------------------
      - name: Fetch news
        id: news
        run: |
          curl -s \
            -H "api-key: ${{ secrets.API_KEY }}" \
            "${{ secrets.PUBLIC_RUN_NEWS_URL }}" \
            > news.json

          echo "news_file=news.json" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------
      # DEBUG
      # -----------------------------------------------------------
      - name: Debug raw output
        run: |
          echo "---- METRICS.JSON ----"
          cat "${{ steps.metrics.outputs.metrics_file }}"
          echo ""
          echo "---- NEWS.JSON ----"
          cat "${{ steps.news.outputs.news_file }}"
          echo ""

      # -----------------------------------------------------------
      # SEND DISCORD
      # -----------------------------------------------------------
      - name: Send Discord Messages
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NEWS_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
        run: |
          qs() { printf "%s" "$1"; }

          METRICS_FILE="${{ steps.metrics.outputs.metrics_file }}"
          NEWS_FILE="${{ steps.news.outputs.news_file }}"

          ###########################################################
          # NEWS LOOP — jq reads directly from file
          ###########################################################
          if jq -e 'length>0' "$NEWS_FILE" >/dev/null 2>&1; then
            jq -c '. | to_entries[]' "$NEWS_FILE" | while read -r entry; do
              TICKER=$(echo "$entry" | jq -r '.key')

              echo "$entry" | jq -c '.value[]' | while read -r article; do
                TITLE=$(echo "$article" | jq -r '.title')
                SENTIMENT=$(echo "$article" | jq -r '.sentiment')
                INSIGHT=$(echo "$article" | jq -r '.insight')

                PAYLOAD=$(jq -c -n \
                  --arg t "$TICKER" \
                  --arg title "$TITLE" \
                  --arg se "$SENTIMENT" \
                  --arg insight "$INSIGHT" \
                  '{
                    embeds: [{
                      title: ($t + " News"),
                      color: 3447003,
                      fields: [
                        { name: "Title", value: $title, inline: false },
                        { name: "Sentiment", value: $se, inline: true },
                        { name: "Insight", value: $insight, inline: false }
                      ]
                    }]
                  }')

                curl -s -X POST -H "Content-Type: application/json" \
                  -d "$PAYLOAD" "$NEWS_WEBHOOK"

                sleep 1
              done
            done
          else
            echo "NEWS JSON is empty — skipping"
          fi

          ###########################################################
          # METRICS LOOP — jq reads directly from file
          ###########################################################
          jq -c '. | to_entries[]' "$METRICS_FILE" | while read -r entry; do
            TICKER=$(echo "$entry" | jq -r '.key')
            EV=$(echo "$entry" | jq '.value.evaluation')
            LATEST=$(echo "$entry" | jq '.value.latest')

            BUY=$(echo "$EV" | jq -r '.BUY // 0')
            HOLD=$(echo "$EV" | jq -r '.HOLD // 0')
            SELL=$(echo "$EV" | jq -r '.SELL // 0')

            BUY_PCT=$(printf "%.0f" "$(echo "$BUY * 100" | bc)")
            HOLD_PCT=$(printf "%.0f" "$(echo "$HOLD * 100" | bc)")
            SELL_PCT=$(printf "%.0f" "$(echo "$SELL * 100" | bc)")

          PAYLOAD=$(jq -c -n \
            --arg t "$TICKER" \
            --arg buy "${BUY_PCT}%" \
            --arg hold "${HOLD_PCT}%" \
            --arg sell "${SELL_PCT}%" \
            --arg open "$(echo "$LATEST" | jq -r '.Open // "N/A"')" \
            --arg high "$(echo "$LATEST" | jq -r '.High // "N/A"')" \
            --arg low "$(echo "$LATEST" | jq -r '.Low // "N/A"')" \
            --arg close "$(echo "$LATEST" | jq -r '.Close // "N/A"')" \
            --arg pct "$(echo "$LATEST" | jq -r '.pct_change // "N/A"')" \
            --arg vol "$(echo "$LATEST" | jq -r '.Volume // "N/A"')" \
            --arg unvol "$(echo "$LATEST" | jq -r '.unusual_volume // "N/A"')" \
            --arg avgvol "$(echo "$LATEST" | jq -r '.avg_volume_20 // "N/A"')" \
            --arg ma50 "$(echo "$LATEST" | jq -r '.ma50 // "N/A"')" \
            --arg ma200 "$(echo "$LATEST" | jq -r '.ma200 // "N/A"')" \
            --arg rsi "$(echo "$LATEST" | jq -r '.rsi // "N/A"')" \
            --arg macd "$(echo "$LATEST" | jq -r '.macd // "N/A"')" \
            --arg macdsig "$(echo "$LATEST" | jq -r '.macd_signal // "N/A"')" \
            --arg atr "$(echo "$LATEST" | jq -r '.atr // "N/A"')" \
            --arg rel "$(echo "$LATEST" | jq -r '.rel_strength // "N/A"')" \
            --arg h52 "$(echo "$LATEST" | jq -r '."52w_high" // "N/A"')" \
            --arg l52 "$(echo "$LATEST" | jq -r '."52w_low" // "N/A"')" \
            '
            {
              embeds: [{
                title: ($t + " Metrics"),
                color: 5814783,
                fields: [
                  { name: "Buy", value: $buy, inline: true },
                  { name: "Hold", value: $hold, inline: true },
                  { name: "Sell", value: $sell, inline: true },

                  { name: "Open", value: $open, inline: true },
                  { name: "High", value: $high, inline: true },
                  { name: "Low", value: $low, inline: true },
                  { name: "Close", value: $close, inline: true },

                  { name: "Pct Change", value: $pct, inline: true },
                  { name: "Volume", value: $vol, inline: true },
                  { name: "Unusual Vol", value: $unvol, inline: true },
                  { name: "Avg Vol (20d)", value: $avgvol, inline: true },

                  { name: "MA50", value: $ma50, inline: true },
                  { name: "MA200", value: $ma200, inline: true },
                  { name: "RSI", value: $rsi, inline: true },
                  { name: "MACD", value: $macd, inline: true },
                  { name: "MACD Signal", value: $macdsig, inline: true },
                  { name: "ATR", value: $atr, inline: true },
                  { name: "Relative Strength", value: $rel, inline: true },

                  { name: "52w High", value: $h52, inline: true },
                  { name: "52w Low", value: $l52, inline: true }
                ]
              }]
            }
            ')


            curl -s -X POST -H "Content-Type: application/json" \
              -d "$PAYLOAD" "$WEBHOOK"

            sleep 1
          done
